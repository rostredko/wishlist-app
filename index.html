    <!-- Canonical and hreflang are injected per route at build time by scripts/prerender.ts.

    <script defer src="https://www.googletagmanager.com/gtag/js?id=G-X8QM3ZWMZ8"></script>
    <script>
        // Initialize dataLayer immediately
        window.dataLayer = window.dataLayer || [];

        // Define and export gtag function globally
        function gtag() {
            window.dataLayer.push(arguments);
        }
        window.gtag = gtag;

        // Queue configuration before application events, even when the external script is blocked.
        // Automatic measurement must remain disabled in GA4; application events supply safe route metadata.
        let referrerOrigin = '';
        try { referrerOrigin = new URL(document.referrer).origin; } catch { /* No valid referrer. */ }
        gtag('js', new Date());
        gtag('config', 'G-X8QM3ZWMZ8', {
            send_page_view: false,
            page_title: 'WishList App',
            page_location: window.location.origin + (window.location.pathname.startsWith('/en') ? '/en' : '/ua'),
            page_referrer: referrerOrigin,
            allow_google_signals: false,
            allow_ad_personalization_signals: false
        });
    </script>

        img {

        @media (prefers-reduced-motion: reduce) {

<body>
    <style>
        /* Critical CSS for Static Shell */
        :root {
            --primary: #2196f3;
            /* Dark mode primary from theme.ts */
            --bg: #1c1c1c;
            /* Dark mode bg from theme.ts */
            --paper: #282828;
            --text: #fff;
        }

        /* If we support light mode, we can add media query, but let's match the likely default first */
        @media (prefers-color-scheme: light) {
            /* If the app supports light mode, keep this. If not, this might be wrong. 
               Let's assume the user wants the dark theme colors since 'theme.ts' exported 'darkTheme'.
               I will stick to the dark theme colors as default for now to be safe against 'white burst'. 
            */
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
        }

        .shell-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .shell-logo {
            font-weight: 700;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Shell hero padding matches React: Box pt={xs:6,md:10} = 48px / 80px */
        .shell-hero {
            padding: 48px 24px 4px;
            max-width: 900px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        @media (min-width: 900px) {
            .shell-hero {
                padding-top: 80px;
            }
        }

        /* Shell h1 matches theme.ts Typography h3 breakpoints to avoid CLS on hydration */
        .shell-h1 {
            font-size: 1.65rem;
            font-weight: 800;
            line-height: 1.25;
            margin: 0;
        }

        @media (min-width: 600px) {
            .shell-h1 {
                font-size: 2rem;
            }
        }

        @media (min-width: 900px) {
            .shell-h1 {
                font-size: 2.5rem;
            }
        }

        .shell-hero a {
            color: var(--primary);
        }

        .shell-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 22px;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 500;
            text-transform: uppercase;
            height: 42px;
            width: 140px;
            opacity: 0.5;
            /* Loading state */
        }

        .shell-skel-text {
            background-color: rgba(128, 128, 128, 0.2);
            height: 20px;
            border-radius: 4px;
            margin-bottom: 8px;
            width: 80%;
        }
    </style>
    <div id="root">
        <!-- Static App Shell for LCP -->
        <div class="shell-header">

                </svg>
                WishList App
            </div>
        </div>
        <div class="shell-hero">
            <!-- prerender:hero -->
            <h1 class="shell-h1">
                Створіть вішліст - список бажань онлайн безкоштовно
            </h1>
            <div class="shell-skel-text" style="width: 100%; max-width: 600px; height: 28px; margin-bottom: 24px;">
            </div>
            <div class="shell-btn"></div>
            <!-- /prerender:hero -->
        </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- prerender:noscript -->
    <noscript>

    </noscript>
    <!-- /prerender:noscript -->
</body>

</html>
